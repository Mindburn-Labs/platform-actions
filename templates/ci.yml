# Copy to .github/workflows/ci.yml. The required status check is `ci / gate`,
# so keep the job id `ci`. Change `main` if the default branch differs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: Mindburn-Labs/platform-actions/.github/workflows/ci.yml@v2
    # Optional:
    # with:
    #   setup-commands: npm ci
    #   extra-commands: make e2e
    # secrets:
    #   MINDBURN_ORG_READ_TOKEN: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}

  # Repositories that release: tag the default branch when CI is green, then
  # build the image from that tag in the same run. Delete `tag` and `image`
  # where nothing is released; keep `tag` alone for releases that are not an
  # image (then call your own release job with the `tag` output).
  #
  # auto-tag pushes with this job's GITHUB_TOKEN, hence `contents: write`.
  # That push starts no other workflow, which is why the image job is chained
  # here on the `tag` output rather than triggered by the tag.
  tag:
    needs: ci
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: Mindburn-Labs/platform-actions/.github/workflows/auto-tag.yml@v2
    # Optional: push the tag as the mindburn-flux App instead, which also
    # starts `on: push: tags` workflows (for a repo that keeps a separate
    # tag-triggered release; drop the `image` job then). `contents: read`
    # is enough on this job with the App.
    # secrets:
    #   MINDBURN_FLUX_APP_ID: ${{ secrets.MINDBURN_FLUX_APP_ID }}
    #   MINDBURN_FLUX_PRIVATE_KEY: ${{ secrets.MINDBURN_FLUX_PRIVATE_KEY }}

  image:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: Mindburn-Labs/platform-actions/.github/workflows/release-image.yml@v2
    with:
      tag: ${{ needs.tag.outputs.tag }}
      # Optional: image, context, dockerfile, platforms, build-args,
      # build-contexts, setup-commands, verify-commands (see the README).
