# Proof only, never merged: one failing make check shard.
# Expected: `check / make check (2/2)` failure, `check / gate` failure,
# `failed-shard / gate` failure.
name: Gate proof (shards)

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      check-shards: 2
      setup-commands: |
        echo "CHECK_SHARD=${CHECK_SHARD}"
        if [[ "${CHECK_SHARD}" == 2/2 ]]; then echo "deliberate failure in shard 2/2"; exit 1; fi
        version=1.7.12
        sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        archive="${RUNNER_TEMP}/actionlint.tar.gz"
        curl --fail --silent --show-error --location --retry 3 --proto '=https' --output "${archive}" \
          "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
        echo "${sha256}  ${archive}" | sha256sum --check --strict
        mkdir -p "${RUNNER_TEMP}/bin"
        tar -xzf "${archive}" -C "${RUNNER_TEMP}/bin" actionlint
        echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

  failed-shard:
    needs: [check]
    if: always()
    uses: ./.github/workflows/gate.yml
    with:
      results: ${{ toJSON(needs) }}
