# CI v2: the one CI contract every Mindburn-Labs repository calls.
#
#   jobs:
#     ci:
#       permissions:
#         contents: read
#         actions: read
#         pull-requests: read
#       uses: Mindburn-Labs/platform-actions/.github/workflows/ci.yml@v2.0.4
#
# The caller triggers on pull_request, push to the default branch and
# merge_group, with no path filters, so `gate` reports on every change and can
# be the single required status check. GitHub names the check after the caller
# job: with the job id `ci` above it is `ci / gate`.
#
# Jobs:
#   check           toolchains detected from the repository, then `make check`.
#   release-readiness  exact GitOps promotion or a frozen staging operation.
#                     Promotion uses the verified default-main evaluator and source-owned
#                     signed evidence. Finite operations use independently
#                     resolved default-main policy. Website operations verify
#                     native source and operator custody in a separate step.
#   dependency-scan pull requests and merge groups only: fails on a HIGH or
#                   CRITICAL vulnerability that is present at head and absent
#                   at base. Inherited findings are Dependabot's job.
#   gate            needs every other job; only dependency-scan may skip, on
#                   events other than pull_request and merge_group.
#
# Scripts are inline on purpose: a reusable workflow checks out the CALLER, so
# it cannot read helper files from this repository.
name: CI v2

on:
  workflow_call:
    inputs:
      check-runner:
        description: Hosted runner for make check; ubuntu-latest or ubuntu-24.04.
        type: string
        default: ubuntu-latest
      check-timeout-minutes:
        description: Maximum duration of the make check job, including setup and extra commands, in minutes.
        type: number
        default: 60
      setup-commands:
        description: Shell commands run after toolchain setup and before `make check` (for example `npm ci`).
        type: string
        default: ''
      extra-commands:
        description: Shell commands run after `make check` succeeds, in the same job.
        type: string
        default: ''
    secrets:
      MINDBURN_ORG_READ_TOKEN:
        description: >-
          Optional for ordinary repositories. GitOps promotion readiness needs
          read access to helm-rollout-evidence and the producer Actions APIs.
          A go.mod with replace directives also uses it for sibling clones.
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: make check
    runs-on: ${{ inputs.check-runner == 'ubuntu-24.04' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.check-timeout-minutes }}
    steps:
      - name: Validate hosted check runner
        env:
          CHECK_RUNNER: ${{ inputs.check-runner }}
        run: |
          case "${CHECK_RUNNER}" in
            ubuntu-latest|ubuntu-24.04) ;;
            *) echo "::error::check-runner must be ubuntu-latest or ubuntu-24.04"; exit 1 ;;
          esac

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect toolchains
        id: detect
        run: |
          files="$(git ls-files)"
          found() { grep -Eq "$1" <<<"${files}"; }
          emit() { printf '%s=%s\n' "$1" "$2" >>"${GITHUB_OUTPUT}"; }
          shallowest() { grep -E "$1" <<<"${files}" | awk -F/ 'NR == 1 || NF < depth { best = $0; depth = NF } END { print best }'; }

          if found '(^|/)go\.mod$'; then
            emit go true
            emit go_version_file "$(shallowest '(^|/)go\.mod$')"
          fi

          if found '(^|/)package-lock\.json$'; then
            emit node true
            emit node_cache npm
            emit node_lock '**/package-lock.json'
          fi
          if found '(^|/)pnpm-lock\.yaml$'; then
            emit node true
            emit pnpm true
            if ! found '(^|/)package-lock\.json$'; then
              emit node_cache pnpm
              emit node_lock '**/pnpm-lock.yaml'
            fi
            # pnpm/action-setup reads packageManager from package.json and
            # refuses a second version, so pass one only when it is absent.
            package_manager="$(jq -r '.packageManager // ""' package.json 2>/dev/null || true)"
            if [[ "${package_manager}" != pnpm@* ]]; then
              emit pnpm_version 10
            fi
          fi
          if [[ -f .nvmrc ]]; then
            emit node_version_file .nvmrc
          elif [[ -f .node-version ]]; then
            emit node_version_file .node-version
          fi

          if found '(^|/)(pyproject\.toml|requirements[^/]*\.txt)$'; then
            emit python true
          fi
          if [[ -f .python-version ]]; then
            emit python_version_file .python-version
          fi

          if [[ -f Gemfile ]]; then
            emit ruby true
            if [[ -f .ruby-version || -f .tool-versions || -f mise.toml ]]; then
              emit ruby_version default
            else
              emit ruby_version ruby
            fi
          fi

          if found '(^|/)Cargo\.toml$'; then
            emit rust true
            {
              echo 'rust_workspaces<<RUST_WORKSPACES'
              grep -E '(^|/)Cargo\.lock$' <<<"${files}" | xargs -r -n1 dirname || true
              echo 'RUST_WORKSPACES'
            } >>"${GITHUB_OUTPUT}"
          fi

          if found '\.tf$'; then
            emit terraform true
          fi

          if found '(^|/)Chart\.yaml$'; then
            emit helm true
          fi

          echo "detected:"
          grep -E '^[a-z]+=true$' "${GITHUB_OUTPUT}" | sort -u | sed 's/=true$//; s/^/  /' || echo "  no language toolchain"

      - name: Set up Go
        if: steps.detect.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ steps.detect.outputs.go_version_file }}
          cache-dependency-path: '**/go.sum'

      - name: Clone sibling repositories for go.mod replace directives
        if: steps.detect.outputs.go == 'true'
        env:
          MINDBURN_ORG_READ_TOKEN: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}
        run: |
          # Local-dev pattern: `replace github.com/Mindburn-Labs/<repo> => ../<repo>`.
          # A relative replace that resolves outside this checkout names a
          # sibling repository; one that stays inside it needs nothing.
          siblings=()
          while IFS= read -r -d '' mod; do
            while IFS= read -r target; do
              resolved="$(realpath -m --relative-to=. "$(dirname "${mod}")/${target}")"
              if [[ "${resolved}" == ../* ]]; then
                resolved="${resolved#../}"
                siblings+=("${resolved%%/*}")
              fi
            done < <(grep -oE '=> \.\.?/[^[:space:]]+' "${mod}" | sed 's/^=> //' || true)
          done < <(git ls-files -z -- 'go.mod' '*/go.mod')
          if [[ "${#siblings[@]}" -gt 0 ]]; then
            mapfile -t siblings < <(printf '%s\n' "${siblings[@]}" | sort -u)
          fi
          if [[ "${#siblings[@]}" -eq 0 ]]; then
            echo "no sibling replace targets"
            exit 0
          fi
          if [[ -f vendor/modules.txt ]] && GOWORK=off go list -mod=vendor ./... >/dev/null 2>&1; then
            echo "vendored modules satisfy the replace targets"
            exit 0
          fi
          if [[ -z "${MINDBURN_ORG_READ_TOKEN}" ]]; then
            echo "::error::go.mod replaces point at sibling repositories (${siblings[*]}); pass MINDBURN_ORG_READ_TOKEN in the caller's secrets: block"
            exit 1
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${MINDBURN_ORG_READ_TOKEN}" | base64 -w0)"
          for repo in "${siblings[@]}"; do
            echo "cloning ../${repo}"
            git -c http.extraheader="${auth}" clone --quiet --depth 1 \
              "https://github.com/Mindburn-Labs/${repo}.git" "../${repo}"
          done

      - name: Set up pnpm
        if: steps.detect.outputs.pnpm == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.detect.outputs.pnpm_version }}

      - name: Set up Node.js
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.detect.outputs.node_version_file == '' && 'lts/*' || '' }}
          node-version-file: ${{ steps.detect.outputs.node_version_file }}
          cache: ${{ steps.detect.outputs.node_cache }}
          cache-dependency-path: ${{ steps.detect.outputs.node_lock }}

      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.detect.outputs.python_version_file == '' && '3.12' || '' }}
          python-version-file: ${{ steps.detect.outputs.python_version_file }}
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml

      - name: Set up Ruby
        if: steps.detect.outputs.ruby == 'true'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ steps.detect.outputs.ruby_version }}
          bundler-cache: true

      - name: Set up Rust
        if: steps.detect.outputs.rust == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Keep cargo's own warning behaviour; the action defaults to deny.
          build-warnings: warn
          cache-workspaces: ${{ steps.detect.outputs.rust_workspaces }}

      - name: Set up Terraform
        if: steps.detect.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: steps.detect.outputs.terraform == 'true'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Share a provider cache between Terraform and OpenTofu
        if: steps.detect.outputs.terraform == 'true'
        run: |
          mkdir -p "${HOME}/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache" >>"${GITHUB_ENV}"

      - name: Cache Terraform providers
        if: steps.detect.outputs.terraform == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Set up Helm
        if: steps.detect.outputs.helm == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Run setup commands
        if: inputs.setup-commands != ''
        env:
          COMMANDS: ${{ inputs.setup-commands }}
          # The caller's `with` context has no job token yet. Bind the
          # short-lived read token here, after this reusable job has started.
          GH_TOKEN: ${{ github.token }}
        run: eval "${COMMANDS}"

      - name: make check
        run: |
          if [[ ! -f Makefile && ! -f makefile && ! -f GNUmakefile ]]; then
            echo "::error::CI v2 runs 'make check'; this repository has no Makefile"
            exit 1
          fi
          make check

      - name: Run extra commands
        if: inputs.extra-commands != ''
        env:
          COMMANDS: ${{ inputs.extra-commands }}
        run: eval "${COMMANDS}"

  release-readiness:
    name: release readiness
    if: >-
      github.repository == 'Mindburn-Labs/gitops-platform' &&
      (github.event_name == 'merge_group' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve actual default-main operation policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "${GITHUB_REPOSITORY}" == Mindburn-Labs/gitops-platform ]] || exit 1
          branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          [[ "${branch}" == main && "${EVENT_DEFAULT_BRANCH}" == "${branch}" ]] || {
            echo "::error::default branch changed or is not main"; exit 1;
          }
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::cannot resolve actual default-main policy commit"; exit 1;
          }
          printf 'sha=%s\n' "${sha}" >>"${GITHUB_OUTPUT}"
      - name: Check out actual default-main operation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.policy.outputs.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - name: Verify current default-main policy checkout
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ steps.policy.outputs.sha }}
        run: |
          [[ "$(git -C trusted rev-parse HEAD)" == "${POLICY_SHA}" ]] || {
            echo "::error::operation policy checkout differs from resolved main"; exit 1;
          }
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${current_sha}" == "${POLICY_SHA}" ]] || {
            echo "::error::default main moved during policy checkout"; exit 1;
          }
      - name: Check out event diff base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: gate
          persist-credentials: false
      - name: Check out proposed cluster data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Identify exact promotion target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          POLICY_SHA: ${{ steps.policy.outputs.sha }}
        run: |
          [[ "$(git -C candidate rev-parse HEAD)" == "${CANDIDATE_SHA}" ]] || exit 1
          if [[ "${EVENT_NAME}" == merge_group ]]; then
            [[ "${DEFAULT_BRANCH}" == main && "${BASE_REF}" == refs/heads/main ]] || {
              echo "::error::merge group must target actual default main"; exit 1;
            }
          fi
          changed_file="$(mktemp)"
          # Show both sides of a move so deleting a target-cluster file cannot
          # be hidden by a destination outside that cluster.
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            git -C candidate diff --no-renames --name-only -z "${BASE_SHA}...${CANDIDATE_SHA}" >"${changed_file}" || {
              echo "::error::cannot classify changed cluster paths"; exit 1;
            }
          else
            git -C candidate diff --no-renames --name-only -z "${BASE_SHA}" "${CANDIDATE_SHA}" >"${changed_file}" || {
              echo "::error::cannot classify changed cluster paths"; exit 1;
            }
          fi
          mapfile -d '' -t changed <"${changed_file}"
          rm -- "${changed_file}"
          targets=()
          for path in "${changed[@]}"; do
            case "${path}" in
              clusters/staging-do/*) targets+=(staging-do) ;;
              clusters/production-do/*) targets+=(production-do) ;;
            esac
          done
          unique_targets=()
          for target in "${targets[@]}"; do
            if [[ " ${unique_targets[*]} " != *" ${target} "* ]]; then unique_targets+=("${target}"); fi
          done
          validate_typed_operation() {
            local output
            if output="$(ruby trusted/scripts/validate-readiness-operation.rb \
                --policy-repo trusted --diff-base-repo gate --candidate-repo candidate \
                --policy-sha "${POLICY_SHA}" --diff-base-sha "${BASE_SHA}" \
                --candidate-sha "${CANDIDATE_SHA}" --event "${EVENT_NAME}" \
                --head-ref "${HEAD_REF}" --head-repository "${HEAD_REPOSITORY}" \
                --repository "${GITHUB_REPOSITORY}" --base-ref "${BASE_REF}" \
                --default-branch "${DEFAULT_BRANCH}" \
                --record "${RUNNER_TEMP}/typed-operation.json" \
                2>"${RUNNER_TEMP}/typed-operation-attempt.log")"; then
              case "${output}" in
                credential-preparation|diagnostic-readback) ;;
                *) echo "::error::trusted operation validator returned an unknown kind"; return 1 ;;
              esac
              jq -e --arg kind "${output}" --arg policy "${POLICY_SHA}" \
                --arg base "${BASE_SHA}" --arg candidate "${CANDIDATE_SHA}" \
                '.schema == "gitops-readiness-operation-validation-v1" and
                 .status == "VALIDATED" and .kind == $kind and
                 .policyCommitSha == $policy and .diffBaseSha == $base and
                 .candidateSha == $candidate and
                 .servingChange == false and .environmentReadinessAssessed == false and
                 .productAccepted == false' "${RUNNER_TEMP}/typed-operation.json" >/dev/null || {
                echo "::error::trusted operation validator returned an invalid record"; return 1;
              }
              printf 'targets=\noperation_kind=%s\n' "${output}" >>"${GITHUB_OUTPUT}"
              return 0
            fi
            return 1
          }
          validate_website_operation() {
            local output
            if output="$(ruby trusted/scripts/validate-website-operation.rb \
                --policy-repo trusted --diff-base-repo gate --candidate-repo candidate \
                --policy-sha "${POLICY_SHA}" --diff-base-sha "${BASE_SHA}" \
                --candidate-sha "${CANDIDATE_SHA}" --event "${EVENT_NAME}" \
                --head-ref "${HEAD_REF}" --head-repository "${HEAD_REPOSITORY}" \
                --repository "${GITHUB_REPOSITORY}" --base-ref "${BASE_REF}" \
                --default-branch "${DEFAULT_BRANCH}" \
                --inspect-local \
                2>"${RUNNER_TEMP}/website-operation-attempt.log")"; then
              case "${output}" in
                r2-writer-credential-preparation|script-publisher-credential-preparation|\
                origin-secret-projection|r2-writer-secret-projection|script-publisher-secret-projection|\
                turnstile-secret-projection|r2-prerequisite-apply|formation-claim-bootstrap|\
                turnstile-binding-activation|website-public-release) ;;
                *) echo "::error::trusted website validator returned an unknown kind"; return 1 ;;
              esac
              printf 'targets=\noperation_kind=%s\noperation_target=existing-public-website\nwebsite_operation=yes\n' "${output}" >>"${GITHUB_OUTPUT}"
              return 0
            fi
            return 1
          }
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            if [[ "${HEAD_REF}" == promote/* || "${#targets[@]}" -gt 0 ]]; then
              [[ "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" && "${BASE_REF}" == "${DEFAULT_BRANCH}" ]] || {
                echo "::error::promotion PR must originate in this repository and target the default branch"; exit 1;
              }
              if [[ "${HEAD_REF}" != promote/* && "${unique_targets[*]}" == staging-do ]]; then
                if validate_typed_operation || validate_website_operation; then
                  exit 0
                fi
                {
                  cat "${RUNNER_TEMP}/typed-operation-attempt.log"
                  cat "${RUNNER_TEMP}/website-operation-attempt.log"
                  echo "::error::target cluster changes require an exact reviewed operation or a promote branch"
                }
                exit 1
              fi
              case "${HEAD_REF}" in
                promote/staging-*) target=staging-do ;;
                promote/production-*) target=production-do ;;
                *) echo "::error::target cluster changes require a promote/staging-* or promote/production-* branch"; exit 1 ;;
              esac
              [[ "${#changed[@]}" -gt 0 ]] || { echo "::error::empty promotion PR"; exit 1; }
              for path in "${changed[@]}"; do
                [[ "${path}" == "clusters/${target}/"* ]] || {
                  echo "::error::promotion PR changed an unrelated path: ${path}"; exit 1;
                }
              done
              printf 'targets=%s\n' "${target}" >>"${GITHUB_OUTPUT}"
            else
              printf 'targets=\n' >>"${GITHUB_OUTPUT}"
            fi
          else
            if [[ "${unique_targets[*]}" == staging-do ]]; then
              if validate_typed_operation || validate_website_operation; then
                exit 0
              fi
              echo "merge-group change is outside the finite operation permits; evaluating full readiness"
            fi
            printf 'targets=%s\n' "${unique_targets[*]}" >>"${GITHUB_OUTPUT}"
          fi
      - name: Verify default-main operation policy remains current
        if: steps.target.outputs.operation_kind != ''
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ steps.policy.outputs.sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${current_sha}" == "${POLICY_SHA}" ]] || {
            echo "::error::default main moved after operation validation"; exit 1;
          }
      - name: Validate native website operation evidence
        if: steps.target.outputs.website_operation == 'yes'
        env:
          WEBSITE_SOURCE_GH_TOKEN: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          POLICY_SHA: ${{ steps.policy.outputs.sha }}
          EXPECTED_KIND: ${{ steps.target.outputs.operation_kind }}
        run: |
          set -euo pipefail
          ruby trusted/scripts/validate-website-operation.rb \
            --policy-repo trusted --diff-base-repo gate --candidate-repo candidate \
            --policy-sha "${POLICY_SHA}" --diff-base-sha "${BASE_SHA}" \
            --candidate-sha "${CANDIDATE_SHA}" --event "${EVENT_NAME}" \
            --head-ref "${HEAD_REF}" --head-repository "${HEAD_REPOSITORY}" \
            --repository "${GITHUB_REPOSITORY}" --base-ref "${BASE_REF}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --record "${RUNNER_TEMP}/website-operation.json"
          jq -e --arg kind "${EXPECTED_KIND}" --arg policy "${POLICY_SHA}" \
            --arg base "${BASE_SHA}" --arg candidate "${CANDIDATE_SHA}" \
            '.schema == "gitops-website-operation-validation-v1" and
             .status == "VALIDATED" and .target == "existing-public-website" and
             .environment == "staging-do" and .kind == $kind and
             .effect == (if $kind == "website-public-release" then "public-serving"
                        elif $kind == "r2-prerequisite-apply" or $kind == "formation-claim-bootstrap" or
                             $kind == "turnstile-binding-activation" then "provider-mutation"
                        elif $kind == "r2-writer-credential-preparation" or
                             $kind == "script-publisher-credential-preparation" then "secret-preparation"
                        else "secret-projection" end) and
             .policyCommitSha == $policy and .diffBaseSha == $base and
             .candidateSha == $candidate and
             (.operationDigest | test("^sha256:[0-9a-f]{64}$")) and
             (if .effect == "secret-preparation" or .effect == "secret-projection" then
                .receipts.source.type == "gitops-ci" and .receipts.source.artifactDigest == null
              elif .effect == "provider-mutation" then
                .receipts.source.type == "controller-publish" and
                (.receipts.source.artifactDigest | if type == "string" then test("^sha256:[0-9a-f]{64}$") else false end)
              else
                .receipts.source.type == "retained-release" and
                (.receipts.source.artifactDigest | if type == "string" then test("^sha256:[0-9a-f]{64}$") else false end)
              end) and
             (.receipts.operator.sha256 | test("^[0-9a-f]{64}$")) and
             .servingChange == (.effect == "public-serving") and
             .runtimeMutation == (.effect == "provider-mutation" or .effect == "public-serving") and
             .environmentReadinessAssessed == false and .productAccepted == false' \
            "${RUNNER_TEMP}/website-operation.json" >/dev/null
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${current_sha}" == "${POLICY_SHA}" ]] || {
            echo "::error::default main moved after website evidence validation"; exit 1;
          }
      - name: Read source-owned evidence
        if: steps.target.outputs.targets != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Mindburn-Labs/helm-rollout-evidence
          token: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}
          path: evidence
          persist-credentials: false
      - name: Record bounded operation outcome
        if: steps.target.outputs.operation_kind != ''
        env:
          OPERATION_KIND: ${{ steps.target.outputs.operation_kind }}
          OPERATION_TARGET: ${{ steps.target.outputs.operation_target }}
        run: echo "${OPERATION_KIND} validated for ${OPERATION_TARGET:-staging-do}; environment readiness and product acceptance were not assessed"
      - name: Evaluate every touched environment
        if: steps.target.outputs.targets != ''
        env:
          GH_TOKEN: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          TARGETS: ${{ steps.target.outputs.targets }}
        run: |
          rc=0
          read -r -a targets <<<"${TARGETS}"
          for target in "${targets[@]}"; do
            ruby trusted/scripts/release-readiness.rb \
              --repo candidate --policy-repo trusted --evidence evidence \
              --env "${target}" --sha "${CANDIDATE_SHA}" \
              --output "${RUNNER_TEMP}/release-readiness-${target}.json" || rc=1
          done
          exit "${rc}"
      - name: Retain machine verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-readiness-verdicts
          path: ${{ runner.temp }}/release-readiness-*.json
          if-no-files-found: ignore
      - name: Retain bounded operation validation
        if: steps.target.outputs.operation_kind != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitops-typed-operation-validation
          path: |
            ${{ runner.temp }}/typed-operation.json
            ${{ runner.temp }}/website-operation.json
          if-no-files-found: error

  dependency-scan:
    name: dependency scan
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      OSV_SCANNER_VERSION: v2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - name: Check out the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false

      - name: Check out the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Install osv-scanner
        run: |
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' \
            --output "${bin}/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${bin}/osv-scanner" | sha256sum --check --strict
          chmod +x "${bin}/osv-scanner"
          echo "${bin}" >>"${GITHUB_PATH}"

      - name: Scan base and head
        run: |
          # Exit 1 means "vulnerabilities found", which the next step judges.
          # Anything else is a scanner failure and fails the job.
          scan() {
            osv-scanner scan source --recursive --no-call-analysis=all --allow-no-lockfiles \
              --format json --output-file "$2" "$1" || [[ $? -eq 1 ]]
          }
          scan base base.json
          scan head head.json

      - name: Fail on HIGH or CRITICAL vulnerabilities new in this change
        run: |
          # One line per (ecosystem, package, advisory) at HIGH or CRITICAL:
          # CVSS >= 7.0, or a GitHub advisory rated HIGH/CRITICAL. The version
          # is reported but is not part of the key, so a bump that leaves an
          # advisory open is not counted as new.
          findings() {
            jq -r '
              .results[]?.packages[]? as $p
              | $p.groups[]? as $g
              | select(
                  ((($g.max_severity // "") | tonumber?) // 0) >= 7
                  or any(
                    $p.vulnerabilities[]? | select(.id as $id | $g.ids | index($id));
                    (.database_specific.severity? // "" | ascii_upcase) | IN("HIGH", "CRITICAL")
                  )
                )
              | $g.ids[] as $id
              | [$p.package.ecosystem, $p.package.name, $id, $p.package.version, ($g.max_severity // "")]
              | @tsv
            ' "$1" | sort -u
          }
          findings base.json | cut -f1-3 >base.keys
          findings head.json >head.tsv
          awk -F'\t' 'FILENAME == ARGV[1] { seen[$0]; next } !(($1 FS $2 FS $3) in seen)' base.keys head.tsv >new.tsv
          inherited=$(( $(wc -l <head.tsv) - $(wc -l <new.tsv) ))
          if [[ "${inherited}" -gt 0 ]]; then
            echo "::notice::${inherited} HIGH/CRITICAL finding(s) already exist on the base branch; they are not caused by this change"
          fi
          if [[ -s new.tsv ]]; then
            while IFS=$'\t' read -r ecosystem name id version severity; do
              echo "::error::${ecosystem} ${name}@${version}: ${id} (CVSS ${severity:-n/a}) is new in this change"
            done <new.tsv
            exit 1
          fi
          echo "no new HIGH/CRITICAL vulnerabilities"

  gate:
    if: always()
    needs: [check, dependency-scan, release-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require success with explicit skip policy
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          : "${EVENT_NAME:?GitHub event is required for the skip policy}"
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          jq -e --arg event "${EVENT_NAME}" --arg repo "${REPOSITORY}" '
            def readiness_required:
              $repo == "Mindburn-Labs/gitops-platform"
              and ($event == "merge_group" or $event == "pull_request");
            has("check") and has("dependency-scan") and has("release-readiness")
            and .check.result == "success"
            and (if readiness_required then .["release-readiness"].result == "success"
                 else .["release-readiness"].result == "success" or .["release-readiness"].result == "skipped" end)
            and all(to_entries[];
              .value.result == "success"
              or (.key == "dependency-scan" and .value.result == "skipped"
                  and $event != "pull_request" and $event != "merge_group")
              or (.key == "release-readiness" and .value.result == "skipped" and (readiness_required | not))
            )
          ' <<<"${NEEDS}" >/dev/null
