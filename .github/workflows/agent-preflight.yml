name: AI Agent Review & Preflight

on:
  workflow_call:
    secrets:
      # Optional. Only needed when the caller's go.mod uses the local-dev
      # pattern `replace github.com/Mindburn-Labs/<repo> => ../<repo>`; the
      # gate then clones those sibling repos so `make build/test` resolves.
      MINDBURN_ORG_READ_TOKEN:
        required: false
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-preflight:
    name: Agent contract and focused gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Detect repository toolchains
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          [[ -f go.mod ]] && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false" >> "$GITHUB_OUTPUT"
          [[ -f package.json ]] && echo "node=true" >> "$GITHUB_OUTPUT" || echo "node=false" >> "$GITHUB_OUTPUT"
          [[ -f pyproject.toml || -f requirements.txt ]] && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"
          [[ -f Cargo.toml ]] && echo "rust=true" >> "$GITHUB_OUTPUT" || echo "rust=false" >> "$GITHUB_OUTPUT"
          [[ -f pubspec.yaml ]] && echo "flutter=true" >> "$GITHUB_OUTPUT" || echo "flutter=false" >> "$GITHUB_OUTPUT"

      - name: Materialize local go.mod replace targets
        shell: bash
        env:
          MINDBURN_ORG_READ_TOKEN: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}
        run: |
          set -euo pipefail
          # Local-dev pattern: `replace github.com/Mindburn-Labs/<repo> => ../<repo>`.
          # CI checks out only the caller repo, so `go build`/`go test` fail with
          # "replacement directory ../<repo> does not exist". Clone the siblings
          # next to the caller checkout when the caller passed an org read token.
          # (Line-form replaces only; block-form `replace ( ... )` is not parsed.)
          mapfile -t siblings < <( \
            find . -maxdepth 3 -name go.mod -print0 2>/dev/null \
              | xargs -0 -r grep -hE '=> \.\./[A-Za-z0-9._-]+' 2>/dev/null \
              | sed -E 's/.*=> \.\.\/([A-Za-z0-9._-]+).*/\1/' \
              | sort -u \
          )
          if [ "${#siblings[@]}" -eq 0 ]; then
            echo "no local go.mod replace targets"
            exit 0
          fi
          if [ -z "${MINDBURN_ORG_READ_TOKEN:-}" ]; then
            echo "::error::go.mod replace targets sibling repos (${siblings[*]}) but MINDBURN_ORG_READ_TOKEN was not passed to this reusable workflow. Add it under the caller job's secrets: block."
            exit 1
          fi
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\\n' 'x-access-token' ;;
            *Password*) printf '%s\\n' "${MINDBURN_ORG_READ_TOKEN:?}" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          for repo in "${siblings[@]}"; do
            echo "cloning sibling repo: $repo"
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone --depth 1 \
              "https://github.com/Mindburn-Labs/${repo}.git" \
              "../${repo}"
          done

      - name: Set up Go
        if: steps.detect.outputs.go == 'true'
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify CodeGraph hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -q '^\.codegraph/'; then
            echo "::error::.codegraph/ must not be committed"
            exit 1
          fi
          if command -v codegraph >/dev/null 2>&1; then
            codegraph init -i
          else
            echo "::notice::codegraph CLI is unavailable on this runner; committed .codegraph hygiene was still checked"
          fi

      - name: Validate agent.yaml contract
        shell: bash
        run: |
          set -euo pipefail
          # Validator inlined from .github/actions/validate-agent-risk/validate-agent-risk.py
          # (canonical source of truth; kept in sync by tests/test_inline_validator_drift.py).
          # Inlined because a composite action referenced from a reusable workflow resolves
          # against the CALLER repo, which startup-fails cross-repo callers (HELM-216).
          python3 - "." <<'VALIDATE_AGENT_RISK_PY'
          #!/usr/bin/env python3
          """Validate agent.yaml structure and gitops/infra risk semantics for a caller repo."""

          from __future__ import annotations

          from dataclasses import dataclass
          from fnmatch import fnmatch
          from pathlib import Path
          import re
          import sys

          GITOPS_INFRA_PREFIXES = ("gitops-", "infra-")
          GITOPS_INFRA_REPOS = {"mindburn-infra"}
          SENSITIVE_SURFACES = {
              "environments/**": "environments/production/example.yaml",
              "secrets/**": "secrets/example.env",
              ".github/workflows/**": ".github/workflows/example.yml",
              "terraform/**": "terraform/main.tf",
              "ansible/**": "ansible/site.yml",
          }


          @dataclass(frozen=True)
          class AgentContract:
              repo_type: str
              external_writes: bool
              secrets_required: bool
              protected_paths: tuple[str, ...]


          def _require_match(pattern: str, text: str, label: str) -> re.Match[str]:
              match = re.search(pattern, text, re.MULTILINE)
              if match is None:
                  raise ValueError(f"agent.yaml missing canonical key: {label}")
              return match


          def _parse_protected_paths(text: str) -> tuple[str, ...]:
              lines = text.splitlines()
              items: list[str] = []
              in_block = False
              for line in lines:
                  if line == "  protected_paths:":
                      in_block = True
                      continue
                  if not in_block:
                      continue
                  if line.startswith("    - "):
                      items.append(line.removeprefix("    - ").strip())
                      continue
                  if line.startswith("  ") and not line.startswith("    "):
                      break
                  if line and not line.startswith(" "):
                      break
              return tuple(items)


          def load_agent_contract(path: Path) -> AgentContract:
              text = path.read_text(encoding="utf-8")
              repo_type = _require_match(r"^repo_type:\s*(\S+)\s*$", text, "repo_type").group(1)
              _require_match(r"^owners:\s*$", text, "owners")
              _require_match(r"^commands:\s*$", text, "commands")
              _require_match(r"^risk:\s*$", text, "risk")
              _require_match(r"^agent_entrypoints:\s*$", text, "agent_entrypoints")
              external_writes = _require_match(
                  r"^  external_writes:\s*(true|false)\s*$",
                  text,
                  "external_writes",
              ).group(1) == "true"
              secrets_required = _require_match(
                  r"^  secrets_required:\s*(true|false)\s*$",
                  text,
                  "secrets_required",
              ).group(1) == "true"
              return AgentContract(
                  repo_type=repo_type,
                  external_writes=external_writes,
                  secrets_required=secrets_required,
                  protected_paths=_parse_protected_paths(text),
              )


          def is_gitops_or_infra_repo(repo_root: Path) -> bool:
              repo_name = repo_root.name
              return repo_name.startswith(GITOPS_INFRA_PREFIXES) or repo_name in GITOPS_INFRA_REPOS


          def expected_sensitive_surfaces(repo_root: Path) -> list[str]:
              expected: list[str] = []
              for pattern in SENSITIVE_SURFACES:
                  surface_root = pattern.split("/", 1)[0]
                  if surface_root == ".github":
                      if (repo_root / ".github" / "workflows").exists():
                          expected.append(pattern)
                      continue
                  if (repo_root / surface_root).exists():
                      expected.append(pattern)
              return expected


          def _covers_surface(protected_paths: tuple[str, ...], surface_pattern: str) -> bool:
              sample = SENSITIVE_SURFACES[surface_pattern]
              return any(fnmatch(sample, pattern) for pattern in protected_paths)


          def validate_repo(repo_root: Path) -> list[str]:
              contract = load_agent_contract(repo_root / "agent.yaml")
              if not is_gitops_or_infra_repo(repo_root):
                  return []

              issues: list[str] = []
              if not contract.external_writes:
                  issues.append(
                      f"{repo_root.name}: gitops/infra repos must declare risk.external_writes: true",
                  )
              if not contract.secrets_required:
                  issues.append(
                      f"{repo_root.name}: gitops/infra repos must declare risk.secrets_required: true",
                  )

              missing_surfaces = [
                  surface
                  for surface in expected_sensitive_surfaces(repo_root)
                  if not _covers_surface(contract.protected_paths, surface)
              ]
              if missing_surfaces:
                  issues.append(
                      f"{repo_root.name}: risk.protected_paths underreports deploy surfaces; add coverage for {', '.join(missing_surfaces)}",
                  )
              return issues


          def main(argv: list[str]) -> int:
              repo_root = Path(argv[1]).resolve() if len(argv) > 1 else Path.cwd()
              agent_path = repo_root / "agent.yaml"
              if not agent_path.is_file():
                  print("agent.yaml is required for agent-native repositories", file=sys.stderr)
                  return 1

              try:
                  issues = validate_repo(repo_root)
              except ValueError as exc:
                  print(str(exc), file=sys.stderr)
                  return 1

              if issues:
                  for issue in issues:
                      print(issue, file=sys.stderr)
                  return 1
              return 0


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv))
          VALIDATE_AGENT_RISK_PY

      - name: Run focused repository gates
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Makefile ]]; then
            echo "::error::Makefile is required to expose setup/lint/test/build gates"
            exit 1
          fi

          has_target() {
            # Do not use make -q here: its non-zero "out of date" result becomes
            # a false negative under pipefail. Print the database in dry-run mode
            # instead so a declared target is detected before invoking it.
            make -prRn 2>/dev/null | awk -F: '/^[A-Za-z0-9_.-]+:([^=]|$)/ {print $1}' | grep -qx "$1"
          }

          for target in setup lint test build; do
            if has_target "$target"; then
              make "$target"
            else
              echo "::notice::No Makefile target '$target' in this repository"
            fi
          done
